<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat DOM Observer — demo</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
  main { flex: 1; padding: 24px; overflow-y: auto; }
  [data-message-author-role] { max-width: 640px; margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; }
  [data-message-author-role="user"] { background: #e8f0fe; margin-left: 80px; }
  [data-message-author-role="assistant"] { background: #f1f3f4; margin-right: 80px; }
  aside { width: 380px; background: #111; color: #9fd; font: 12px/1.5 monospace; padding: 16px; overflow-y: auto; }
  aside h2 { color: #fff; font: 600 13px system-ui; margin: 0 0 8px; }
  .controls { position: fixed; bottom: 16px; left: 24px; display: flex; gap: 8px; }
  button { padding: 8px 14px; border: 0; border-radius: 8px; background: #1a73e8; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main id="chat"></main>
<aside><h2>Observer log</h2><div id="log"></div></aside>
<div class="controls">
  <button onclick="addUserMessage()">Add user message</button>
  <button onclick="streamAssistantReply()">Stream assistant reply</button>
</div>
<script src="demo.js"></script>
</body>
</html>
